services:
  backend:
    build: ./backend
    
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - sqlite_data:/app/data
    restart: always

  frontend:
    build: ./frontend
  
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data: