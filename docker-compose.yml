version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - RESET_DB=1

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend