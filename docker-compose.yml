services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5002}:5002"
    environment:
      - RESET_DB=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

## no named volumes required