version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
     
      - ./backend:/app
    
      - /app/node_modules
    
      - sqlite_data:/app/data
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data: