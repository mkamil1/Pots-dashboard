<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clear Local Storage</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <p>Resetting local data and reloading…</p>
    <script>
      try {
        localStorage.clear();
        sessionStorage.clear();
        // Wait a moment so users see the message, then redirect to app root
        setTimeout(() => { location.replace('/'); }, 300);
      } catch (e) {
        console.error('Error clearing storage', e);
        location.replace('/');
      }
    </script>
  </body>
</html>
